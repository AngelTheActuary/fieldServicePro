<!--
  Gráfico instructivo vectorial: Jerarquía de severidad de incidentes (1-5).
  Pirámide: arriba lo más grave y menos frecuente; abajo lo menos grave y más
  frecuente. A la derecha, el tiempo objetivo de respuesta y la prioridad.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 380" width="545" height="380" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <rect width="545" height="380" fill="#05080b"/>
  <text x="20" y="28" fill="#f2f5f8" font-size="16" font-weight="700">JERARQUÍA DE SEVERIDAD DE INCIDENTES</text>
  <text x="20" y="46" fill="#a9b6c4" font-size="11">Escala 1-5 · tiempo objetivo de arribo y prioridad asignada</text>

  <!-- Nivel 5 -->
  <polygon points="160,62 200,62 228,118 132,118" fill="#ff3b47"/>
  <text x="180" y="99" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">5</text>
  <!-- Nivel 4 -->
  <polygon points="130,124 230,124 258,180 102,180" fill="#ff6a3d"/>
  <text x="180" y="161" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">4</text>
  <!-- Nivel 3 -->
  <polygon points="99,186 261,186 289,242 71,242" fill="#ffb020"/>
  <text x="180" y="223" fill="#1a1000" font-size="18" font-weight="800" text-anchor="middle">3</text>
  <!-- Nivel 2 -->
  <polygon points="68,248 292,248 320,304 40,304" fill="#ffd166"/>
  <text x="180" y="285" fill="#1a1000" font-size="18" font-weight="800" text-anchor="middle">2</text>
  <!-- Nivel 1 -->
  <polygon points="37,310 323,310 351,366 9,366" fill="#4c8dff"/>
  <text x="180" y="347" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">1</text>

  <!-- Descripciones -->
  <g font-size="12" fill="#f2f5f8">
    <text x="270" y="84" font-weight="700" fill="#ff3b47">CATASTRÓFICO · Crítica</text>
    <text x="270" y="100">Riesgo a la vida, incendio, paro total.</text>
    <text x="270" y="114" fill="#a9b6c4">Arribo ≤ 30 min · LOTO obligatorio</text>

    <text x="300" y="146" font-weight="700" fill="#ff6a3d">MAYOR · Crítica</text>
    <text x="300" y="162">Paro de línea o servicio esencial.</text>
    <text x="300" y="176" fill="#a9b6c4">Arribo ≤ 60 min</text>

    <text x="330" y="208" font-weight="700" fill="#ffb020">MODERADO · Estándar</text>
    <text x="330" y="224">Operación degradada.</text>
    <text x="330" y="238" fill="#a9b6c4">Arribo ≤ 2 h (SLA)</text>

    <text x="360" y="270" font-weight="700" fill="#ffd166">MENOR · Estándar</text>
    <text x="360" y="286">Falla sin impacto operativo.</text>
    <text x="360" y="300" fill="#a9b6c4">Atención ≤ 8 h</text>

    <text x="390" y="332" font-weight="700" fill="#4c8dff">PREVENTIVO</text>
    <text x="390" y="348">Mant. programado.</text>
    <text x="390" y="362" fill="#a9b6c4">Agenda ≤ 72 h</text>
  </g>

  <!-- Flecha de urgencia -->
  <line x1="532" y1="360" x2="532" y2="70" stroke="#ff3b47" stroke-width="3"/>
  <polygon points="526,74 538,74 532,60" fill="#ff3b47"/>
  <text x="520" y="215" fill="#a9b6c4" font-size="10" text-anchor="middle" transform="rotate(-90 520 215)">URGENCIA</text>
</svg>
